<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Qurat Ul Ain Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body{ background:var(--bg-light); }
  .admin-wrap{ max-width:820px; margin:0 auto; padding:50px 24px 120px; }
  .admin-header{ margin-bottom:36px; }
  .admin-header h1{ font-size:28px; font-weight:700; margin-bottom:6px; }
  .admin-header p{ color:var(--ink-soft); font-size:14.5px; }

  .login-box{
    max-width:380px; margin:80px auto; background:var(--card-light);
    border:1px solid var(--line-light); border-radius:16px; padding:32px;
    text-align:center;
  }
  .login-box h2{ font-size:20px; margin-bottom:8px; }
  .login-box p{ color:var(--ink-soft); font-size:14px; margin-bottom:20px; }
  .login-box input{
    width:100%; padding:12px 14px; border-radius:8px; border:1px solid var(--line-light);
    font-family:'Inter', sans-serif; font-size:14.5px; margin-bottom:12px;
  }
  .login-error{ color:var(--error); font-size:13px; margin-top:8px; min-height:18px; }

  .admin-card{
    background:var(--card-light); border:1px solid var(--line-light); border-radius:16px;
    padding:26px; margin-bottom:24px;
  }
  .admin-card h2{ font-size:18px; margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--line-light); }
  .field{ margin-bottom:16px; }
  .field label{
    display:block; font-family:'JetBrains Mono', monospace; font-size:11.5px;
    text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); margin-bottom:6px;
  }
  .field input[type=text], .field textarea{
    width:100%; padding:11px 13px; border-radius:8px; border:1px solid var(--line-light);
    font-family:'Inter', sans-serif; font-size:14.5px; resize:vertical; background:var(--bg-light);
  }
  .field textarea{ min-height:70px; }
  .row-2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }

  .repeat-item{
    border:1px solid var(--line-light); border-radius:12px; padding:18px; margin-bottom:14px; position:relative;
    background:var(--bg-light);
  }
  .repeat-item .item-num{
    font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--maroon); margin-bottom:12px;
  }
  .checkbox-row{ display:flex; align-items:center; gap:8px; margin:10px 0; }
  .checkbox-row label{ font-size:13.5px; color:var(--ink-soft); text-transform:none; letter-spacing:0; }

  .btn-small{
    font-family:'Inter', sans-serif; font-size:13px; font-weight:600;
    padding:8px 14px; border-radius:8px; border:1px solid var(--line-light);
    background:var(--card-light); cursor:pointer; color:var(--ink-soft);
  }
  .btn-small:hover{ border-color:var(--maroon); color:var(--maroon); }
  .btn-remove{ position:absolute; top:14px; right:14px; }
  .btn-add{ margin-top:6px; }

  .save-bar{
    position:sticky; bottom:0; background:var(--bg-light);
    border-top:1px solid var(--line-light);
    padding:16px 0; margin-top:10px;
    display:flex; align-items:center; gap:16px; justify-content:flex-end;
  }
  .save-status{ font-family:'JetBrains Mono', monospace; font-size:13px; }
  .save-status.success{ color:var(--teal, #17A398); }
  .save-status.error{ color:var(--error); }

  #adminApp{ display:none; }
</style>
</head>
<body>

<div class="admin-wrap">

  <div class="login-box" id="loginBox">
    <h2>Admin Login</h2>
    <p>Enter your password to edit site content.</p>
    <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password">
    <button class="btn btn-maroon" id="loginBtn" style="width:100%;">Unlock</button>
    <div class="login-error" id="loginError"></div>
  </div>

  <div id="adminApp">
    <div class="admin-header">
      <h1>Edit Portfolio Content</h1>
      <p>Changes here update your live site immediately after saving. No code editing required.</p>
    </div>

    <!-- HERO -->
    <div class="admin-card">
      <h2>Hero</h2>
      <div class="field">
        <label>Eyebrow line</label>
        <input type="text" id="f_heroEyebrow">
      </div>
      <div class="row-2">
        <div class="field">
          <label>Title line 1</label>
          <input type="text" id="f_heroTitle1">
        </div>
        <div class="field">
          <label>Title line 2</label>
          <input type="text" id="f_heroTitle2">
        </div>
      </div>
      <div class="field">
        <label>Subtext</label>
        <textarea id="f_heroSub"></textarea>
      </div>
    </div>

    <!-- ABOUT -->
    <div class="admin-card">
      <h2>Who's This / About</h2>
      <div class="field">
        <label>Paragraph 1</label>
        <textarea id="f_aboutP1"></textarea>
      </div>
      <div class="field">
        <label>Paragraph 2</label>
        <textarea id="f_aboutP2"></textarea>
      </div>
      <label style="display:block; font-family:'JetBrains Mono', monospace; font-size:11.5px; text-transform:uppercase; color:var(--ink-faint); margin-bottom:10px;">Stats</label>
      <div id="statsRepeat"></div>
      <button class="btn-small btn-add" id="addStat" type="button">+ Add stat</button>
    </div>

    <!-- EXPERIENCE -->
    <div class="admin-card">
      <h2>Career Journey (Experience)</h2>
      <div id="experienceRepeat"></div>
      <button class="btn-small btn-add" id="addExperience" type="button">+ Add experience entry</button>
    </div>

    <!-- ACADEMICS -->
    <div class="admin-card">
      <h2>Academic Record</h2>
      <div id="academicsRepeat"></div>
      <button class="btn-small btn-add" id="addAcademic" type="button">+ Add academic entry</button>
    </div>

    <!-- LEADERSHIP -->
    <div class="admin-card">
      <h2>Leadership</h2>
      <div id="leadershipRepeat"></div>
      <button class="btn-small btn-add" id="addLeadership" type="button">+ Add leadership entry</button>
    </div>

    <!-- CERTIFICATES -->
<div class="admin-card">
  <h2>Certificates</h2>
  <div id="certificatesRepeat"></div>
  <button class="btn-small btn-add" id="addCertificate" type="button">+ Add certificate</button>
</div>

    <!-- CONTACT -->
    <div class="admin-card">
      <h2>Contact Info</h2>
      <div class="row-2">
        <div class="field">
          <label>Email</label>
          <input type="text" id="f_email">
        </div>
      <div class="row-2">
        <div class="field">
          <label>LinkedIn username</label>
          <input type="text" id="f_linkedin">
        </div>
        <div class="field">
          <label>GitHub username</label>
          <input type="text" id="f_github">
        </div>
      </div>
    </div>

    <div class="save-bar">
      <span class="save-status" id="saveStatus"></span>
      <a href="index.html" class="btn btn-outline" target="_blank">View Site ↗</a>
      <button class="btn btn-maroon" id="saveBtn">Save Changes</button>
    </div>
  </div>

</div>

<script src="js/admin.js"></script>
</body>
</html>
